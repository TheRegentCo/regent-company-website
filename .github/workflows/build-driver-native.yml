name: Build Regent Mile Driver Native Compliance Beta
on:
  push:
    branches: [driver-native-build-temp]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare driver web assets
        run: |
          rm -rf android-driver-native/app/src/main/assets
          mkdir -p android-driver-native/app/src/main/assets android-driver-native/app/src/main/res/drawable
          curl -L --fail --retry 3 "https://drive.google.com/uc?export=download&id=1d8qbzqt1vowlLy8jMVYXfNoMi4Vn1i-d" -o /tmp/regent-driver-assets.zip
          unzip -q /tmp/regent-driver-assets.zip -d android-driver-native/app/src/main/assets
          cp android-driver-native/app/src/main/assets/regent-logo.png android-driver-native/app/src/main/res/drawable/regent_logo.png
      - name: Static JS checks
        run: |
          node --check android-driver-native/app/src/main/assets/app.js
          node --check android-driver-native/app/src/main/assets/core.js
          node --check android-driver-native/app/src/main/assets/driver-ui.js
          node --check android-driver-native/app/src/main/assets/payments.js
          node --check android-driver-native/app/src/main/assets/regent-map.js
          node --check android-driver-native/app/src/main/assets/shift-account.js
      - name: Build debug APK
        run: gradle -p android-driver-native --no-daemon :app:assembleDebug
      - name: Android emulator launch test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle -p android-driver-native --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: Regent-Mile-Driver-Native-Compliance-0.9.0
          path: android-driver-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
